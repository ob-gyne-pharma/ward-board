<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ward Board Live</title>
<meta name="theme-color" content="#1a2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#1a2430;
    --ink-soft:#4a5a68;
    --line:#d7dee3;
    --line-soft:#e9edf0;
    --paper:#f6f8f9;
    --card:#ffffff;
    --accent:#0f6e5c;
    --accent-soft:#e3f2ee;
    --amber:#a8620a;
    --amber-soft:#fbf0dd;
    --red:#b3261e;
    --red-soft:#fbeae9;
    --blue:#1d5f9e;
    --blue-soft:#e5eff8;
    --purple:#6b4c9e;
    --purple-soft:#efe8f8;
    --empty-bar:#c7cfd4;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:80px;
  }

  header{
    position:sticky; top:0; z-index:20;
    background:var(--ink); color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .brand{display:flex; align-items:baseline; gap:10px; min-width:0;}
  .brand .mark{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg);flex-shrink:0;}
  .brand h1{font-size:1.05rem; font-weight:600; margin:0; color:#fff; background:none; border:none; padding:2px 4px;}
  .header-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  #clock{font-variant-numeric:tabular-nums; font-size:0.82rem; color:#cdd6dc;}

  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:6px;
    font-size:0.82rem; padding:10px 16px; font-weight:600;
    touch-action:manipulation; -webkit-appearance:none;
    transition:background .12s ease, transform .05s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:rgba(255,255,255,0.1); color:#fff;}
  .btn-outline{background:#fff; color:var(--ink); border:1px solid var(--line);}
  .btn-danger-outline{background:#fff; color:var(--red); border:1px solid #e8b9b6;}
  .btn-small{padding:6px 12px; font-size:0.74rem;}

  .ward-tabs{
    display:flex; gap:6px; padding:10px 20px; background:var(--card);
    border-bottom:1px solid var(--line-soft); overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .ward-tab{
    flex-shrink:0; padding:8px 16px; border-radius:20px; font-size:0.82rem; font-weight:600;
    background:var(--line-soft); color:var(--ink-soft); cursor:pointer; white-space:nowrap; touch-action:manipulation;
  }
  .ward-tab.active{background:var(--accent); color:#fff;}
  .ward-tab.add-ward{background:#fff; border:1px dashed var(--line); color:var(--ink-soft);}

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; gap:12px; flex-wrap:wrap; background:var(--card); border-bottom:1px solid var(--line-soft);
  }
  .stat-pills{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    font-size:0.76rem; font-weight:600; padding:6px 12px; border-radius:20px;
    background:var(--line-soft); color:var(--ink-soft); display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  .pill.active{border:1.5px solid currentColor;}
  .pill.occ{background:var(--accent-soft); color:var(--accent);}
  .pill.urgent{background:var(--red-soft); color:var(--red);}
  .pill.review{background:var(--amber-soft); color:var(--amber);}
  .pill.stable{background:var(--blue-soft); color:var(--blue);}

  .filter-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  select, input, textarea{
    font-family:inherit; border:1.5px solid var(--line); border-radius:6px;
    padding:10px; font-size:16px; background:#fff !important; color:var(--ink) !important;
    -webkit-text-fill-color:var(--ink); opacity:1; touch-action:manipulation;
  }
  select{ -webkit-appearance:menulist; appearance:menulist; min-height:44px; }

  #grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:14px; padding:16px 20px; max-width:1700px; margin:0 auto;
  }
  .room-group{
    grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px;
  }
  .room-group-label{
    grid-column:1/-1; font-size:0.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--ink-soft); margin-top:6px; padding-left:2px;
  }
  .bed-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  .bed-card.empty{background:#fbfcfc;}
  .bed-card.acuity-urgent{box-shadow:0 0 0 2px var(--red);}
  .bed-card.acuity-review{box-shadow:0 0 0 2px var(--amber);}

  .bed-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line-soft); background:var(--paper);
  }
  .bed-num{font-size:1.1rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .bed-num .bar{width:6px; height:20px; border-radius:3px; background:var(--empty-bar);}
  .bed-card.occupied .bed-num .bar{background:var(--accent);}
  .bed-card.acuity-urgent .bed-num .bar{background:var(--red);}
  .bed-card.acuity-review .bed-num .bar{background:var(--amber);}

  .tag-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tag{
    font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:3px 8px; border-radius:20px; background:var(--line-soft); color:var(--ink-soft);
  }
  .tag.acuity-stable{background:var(--blue-soft); color:var(--blue);}
  .tag.acuity-review{background:var(--amber-soft); color:var(--amber);}
  .tag.acuity-urgent{background:var(--red-soft); color:var(--red);}
  .tag.type-antenatal{background:var(--accent-soft); color:var(--accent);}
  .tag.type-postnatal{background:var(--purple-soft); color:var(--purple);}
  .tag.type-gynae{background:#fdeee0; color:#b5580d;}

  .bed-body{padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:9px;}
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:24px 10px; color:var(--ink-soft); text-align:center; flex:1;
  }
  .empty-state .hint{font-size:0.78rem;}

  .field{display:flex; flex-direction:column; gap:3px;}
  .field label{font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);}
  .field .value{font-size:0.86rem; line-height:1.4; color:var(--ink); word-break:break-word; white-space:pre-wrap;}
  .field .value.empty-val{color:#aab4bb; font-style:italic;}

  .patient-name-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .patient-name-row .pname{font-weight:700; font-size:1.0rem;}
  .patient-name-row .meta{font-size:0.76rem; color:var(--ink-soft);}

  .admit-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper); border:1px solid var(--line-soft); border-radius:7px; padding:7px 10px; font-size:0.76rem;
  }

  .bed-actions{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line-soft); background:#fcfdfd; flex-wrap:wrap;}
  .bed-actions button{flex:1; min-width:44%; min-height:42px;}

  /* Modal Overlays */
  .overlay{
    position:fixed; inset:0; background:rgba(20,28,34,0.6);
    display:none; align-items:flex-end; justify-content:center; z-index:100; padding:0;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:600px;
    box-shadow:0 -10px 40px rgba(0,0,0,0.3); display:flex; flex-direction:column; max-height:90vh;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line-soft); flex-shrink:0;
  }
  .modal-head h2{font-size:1.05rem; margin:0;}
  .modal-close{background:none; color:var(--ink-soft); font-size:1.2rem; padding:8px;}
  .modal-body{
    padding:18px 20px; display:flex; flex-direction:column; gap:14px;
    overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1 1 auto;
  }
  .modal-foot{
    padding:14px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line-soft);
    display:flex; justify-content:flex-end; gap:10px; background:#fff; flex-shrink:0;
  }
  .modal-foot button{min-height:48px; min-width:110px; font-size:0.95rem;}

  .form-field{display:flex; flex-direction:column; gap:5px;}
  .form-field label{font-size:0.76rem; font-weight:700; color:var(--ink-soft);}
  .form-field textarea, .form-field input[type="text"], .form-field select{
    width:100%; padding:12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:16px; font-family:inherit; resize:vertical; background:#fff !important; color:var(--ink) !important;
  }
  .form-field textarea{min-height:70px;}
  .form-row{display:flex; gap:10px; flex-wrap:wrap;}
  .form-row .form-field{flex:1; min-width:130px;}

  .type-toggle{display:flex; gap:8px; flex-wrap:wrap;}
  .type-btn{
    flex:1; min-width:90px; padding:12px 8px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); font-weight:700; font-size:0.8rem; text-align:center;
  }
  .type-btn.active.antenatal{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .type-btn.active.postnatal{border-color:var(--purple); background:var(--purple-soft); color:var(--purple);}
  .type-btn.active.gynae{border-color:#b5580d; background:#fdeee0; color:#b5580d;}

  .acuity-toggle{display:flex; gap:8px;}
  .acuity-btn{
    flex:1; padding:12px 8px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); font-weight:700; font-size:0.8rem; text-align:center;
  }
  .acuity-btn.active.stable{border-color:var(--blue); background:var(--blue-soft); color:var(--blue);}
  .acuity-btn.active.review{border-color:var(--amber); background:var(--amber-soft); color:var(--amber);}
  .acuity-btn.active.urgent{border-color:var(--red); background:var(--red-soft); color:var(--red);}

  .section-divider{
    font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); border-top:1px solid var(--line-soft); padding-top:12px; margin-top:2px;
  }
  footer{ text-align:center; padding:18px; color:var(--ink-soft); font-size:0.74rem; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"></span>
    <h1 id="appTitle">Ward Board</h1>
  </div>
  <div class="header-actions">
    <span id="clock"></span>
    <button class="btn-ghost btn-small" id="staffNameBtn">👤 Set name</button>
  </div>
</header>

<div class="ward-tabs" id="wardTabs"></div>

<div class="toolbar">
  <div class="stat-pills" id="statPills"></div>
  <div class="filter-row">
    <select id="unitFilter">
      <option value="">All units</option>
      <option value="A">Unit A</option>
      <option value="B">Unit B</option>
      <option value="C">Unit C</option>
      <option value="D">Unit D</option>
      <option value="E">Unit E</option>
    </select>
    <select id="typeFilter">
      <option value="">All types</option>
      <option value="antenatal">Antenatal</option>
      <option value="postnatal">Postnatal</option>
      <option value="gynae">Gynae</option>
    </select>
    <input type="search" id="searchBox" placeholder="Search…" style="width:140px;">
  </div>
</div>

<div id="grid"></div>

<footer>For clinical use during duty</footer>

<!-- ===== Modal: Add/Edit Patient ===== -->
<div class="overlay" id="patientOverlay">
  <div class="modal" id="patientModalBox">
    <div class="modal-head">
      <h2 id="modalTitle">Bed — New Patient</h2>
      <button class="modal-close" id="closePatientModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label>Patient type</label>
        <div class="type-toggle" id="typeToggle">
          <button type="button" class="type-btn antenatal" data-type="antenatal">Antenatal</button>
          <button type="button" class="type-btn postnatal" data-type="postnatal">Postnatal</button>
          <button type="button" class="type-btn gynae" data-type="gynae">Gynae</button>
        </div>
      </div>

      <div class="form-field">
        <label>Acuity</label>
        <div class="acuity-toggle" id="acuityToggle">
          <button type="button" class="acuity-btn stable" data-acuity="stable">Stable</button>
          <button type="button" class="acuity-btn review" data-acuity="review">Needs Review</button>
          <button type="button" class="acuity-btn urgent" data-acuity="urgent">Urgent</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Name / Initials</label>
          <input type="text" id="f_name" placeholder="e.g. Mrs A.K.">
        </div>
        <div class="form-field">
          <label>Age</label>
          <input type="text" id="f_age" placeholder="e.g. 29y">
        </div>
        <div class="form-field">
          <label>Unit</label>
          <select id="f_unit">
            <option value="">—</option>
            <option value="A">Unit A</option>
            <option value="B">Unit B</option>
            <option value="C">Unit C</option>
            <option value="D">Unit D</option>
            <option value="E">Unit E</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label>Diagnosis</label>
        <textarea id="f_diagnosis"></textarea>
      </div>
      <div class="form-field">
        <label>Current situation</label>
        <textarea id="f_situation"></textarea>
      </div>

      <div class="section-divider">General</div>
      <div class="form-field" style="margin-top:10px;">
        <label>Plan</label>
        <textarea id="f_plan"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-outline" id="cancelPatientModal">Cancel</button>
      <button class="btn-primary" id="savePatientModal">Save Patient</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "ward_board_v1";
  var ROOMS_PER_WARD = 20;
  var BEDS = ["A","B"];

  var state = { wardOrder: [], wards: {} };
  var activeWardId = null;
  var activeAcuityFilter = "";
  var memoryState = null; // foolproof fallback for mobile sandboxes

  function uid(){ return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.wards){ state = parsed; return; }
      }
    }catch(e){
      if(memoryState){ state = memoryState; return; }
    }

    if(!state.wardOrder || state.wardOrder.length === 0){
      state.wardOrder = [];
      state.wards = {};
      ["Ward A","Ward B","Ward C","Ward D","Ward E"].forEach(function(name){
        var id = uid();
        state.wardOrder.push(id);
        state.wards[id] = { name: name, rooms: {} };
      });
    }
    activeWardId = state.wardOrder[0];
  }

  function saveState(){
    try{
      var serialized = JSON.stringify(state);
      localStorage.setItem(STORAGE_KEY, serialized);
    }catch(e){
      memoryState = JSON.parse(JSON.stringify(state));
    }
  }

  function currentWard(){ return state.wards[activeWardId]; }
  function bedKey(room, bed){ return room + bed; }
  function nowISO(){ return new Date().toISOString(); }

  /* Staff Name */
  function getStaffName(){ return (state.staffName || "").trim(); }
  document.getElementById("staffNameBtn").onclick = function(){
    var name = prompt("Your name:", getStaffName());
    if(name !== null){ state.staffName = name.trim(); saveState(); document.getElementById("staffNameBtn").textContent = "👤 " + state.staffName; }
  };

  /* Ward Tabs */
  var wardTabsEl = document.getElementById("wardTabs");
  function renderWardTabs(){
    wardTabsEl.innerHTML = "";
    state.wardOrder.forEach(function(id){
      var w = state.wards[id];
      var tab = document.createElement("div");
      tab.className = "ward-tab" + (id===activeWardId ? " active" : "");
      tab.textContent = w.name;
      tab.onclick = function(){ activeWardId = id; render(); };
      wardTabsEl.appendChild(tab);
    });
    var addTab = document.createElement("div");
    addTab.className = "ward-tab add-ward";
    addTab.textContent = "+ Add ward";
    addTab.onclick = function(){
      var name = prompt("Ward name:", "Ward " + String.fromCharCode(65 + state.wardOrder.length));
      if(!name) return;
      var id = uid();
      state.wards[id] = { name: name.trim(), rooms: {} };
      state.wardOrder.push(id);
      activeWardId = id;
      saveState(); render();
    };
    wardTabsEl.appendChild(addTab);
  }

  var grid = document.getElementById("grid");
  var statPills = document.getElementById("statPills");
  var searchBox = document.getElementById("searchBox");
  var unitFilter = document.getElementById("unitFilter");
  var typeFilter = document.getElementById("typeFilter");

  var TYPE_LABEL = { antenatal:"Antenatal", postnatal:"Postnatal", gynae:"Gynae" };
  var ACUITY_LABEL = { stable:"Stable", review:"Needs Review", urgent:"Urgent" };

  function render(){
    renderWardTabs();
    var query = searchBox.value.trim().toLowerCase();
    var unitQ = unitFilter.value;
    var typeQ = typeFilter.value;
    grid.innerHTML = "";

    var occCount=0, urgentCount=0, reviewCount=0, stableCount=0;
    var w = currentWard();

    for(var r=1; r<=ROOMS_PER_WARD; r++){
      BEDS.forEach(function(bed){
        var key = bedKey(r, bed);
        var patient = w.rooms[key] || null;
        if(patient){
          occCount++;
          if(patient.acuity==="urgent") urgentCount++;
          else if(patient.acuity==="review") reviewCount++;
          else stableCount++;
        }
      });
    }

    statPills.innerHTML =
      '<span class="pill occ"><span class="n">'+occCount+'</span> occupied</span>' +
      '<span class="pill urgent'+(activeAcuityFilter==="urgent"?" active":"")+'" id="pillUrgent"><span class="n">'+urgentCount+'</span> urgent</span>' +
      '<span class="pill review'+(activeAcuityFilter==="review"?" active":"")+'" id="pillReview"><span class="n">'+reviewCount+'</span> review</span>' +
      '<span class="pill stable'+(activeAcuityFilter==="stable"?" active":"")+'" id="pillStable"><span class="n">'+stableCount+'</span> stable</span>';

    document.getElementById("pillUrgent").onclick = function(){ activeAcuityFilter = activeAcuityFilter==="urgent"?"":"urgent"; render(); };
    document.getElementById("pillReview").onclick = function(){ activeAcuityFilter = activeAcuityFilter==="review"?"":"review"; render(); };
    document.getElementById("pillStable").onclick = function(){ activeAcuityFilter = activeAcuityFilter==="stable"?"":"stable"; render(); };

    for(var room=1; room<=ROOMS_PER_WARD; room++){
      var anyVisible = false;
      var groupWrap = document.createElement("div");
      groupWrap.className = "room-group";

      BEDS.forEach(function(bed){
        var key = bedKey(room, bed);
        var patient = w.rooms[key] || null;

        if(patient){
          if(unitQ && patient.unit !== unitQ) return;
          if(typeQ && patient.type !== typeQ) return;
          if(activeAcuityFilter && patient.acuity !== activeAcuityFilter) return;
          if(query){
            var hay = [patient.name, patient.diagnosis, patient.situation, patient.plan, room+bed].join(" ").toLowerCase();
            if(hay.indexOf(query) === -1) return;
          }
        } else {
          if(unitQ || typeQ || activeAcuityFilter) return;
        }

        anyVisible = true;
        groupWrap.appendChild(renderBedCard(room, bed, patient));
      });

      if(anyVisible){
        var label = document.createElement("div");
        label.className = "room-group-label";
        label.textContent = "Room " + room;
        grid.appendChild(label);
        grid.appendChild(groupWrap);
      }
    }
  }

  function renderBedCard(room, bed, patient){
    var card = document.createElement("div");
    card.className = "bed-card " + (patient ? "occupied acuity-" + patient.acuity : "empty");

    var top = document.createElement("div");
    top.className = "bed-top";
    top.innerHTML = '<div class="bed-num"><span class="bar"></span>'+room+bed+'</div>';
    if(patient){
      top.innerHTML += '<div class="tag-row"><span class="tag acuity-'+patient.acuity+'">'+ACUITY_LABEL[patient.acuity]+'</span><span class="tag type-'+patient.type+'">'+TYPE_LABEL[patient.type]+'</span></div>';
    }
    card.appendChild(top);

    var body = document.createElement("div");
    body.className = "bed-body";

    if(!patient){
      body.innerHTML = '<div class="empty-state"><div>Empty Bed</div><div class="hint">Tap Add Patient</div></div>';
      card.appendChild(body);
      var actionsEmpty = document.createElement("div");
      actionsEmpty.className = "bed-actions";
      var addBtn = document.createElement("button");
      addBtn.className = "btn-primary";
      addBtn.textContent = "Add Patient";
      addBtn.onclick = function(){ openPatientModal(room, bed, null); };
      actionsEmpty.appendChild(addBtn);
      card.appendChild(actionsEmpty);
      return card;
    }

    body.innerHTML = '<div class="patient-name-row"><span class="pname">'+(patient.name||"Unnamed")+'</span>'+(patient.age?'<span class="meta">'+patient.age+'</span>':'')+'</div>' +
      '<div class="field"><label>Diagnosis</label><div class="value">'+(patient.diagnosis||'<span class="empty-val">None</span>')+'</div></div>' +
      '<div class="field"><label>Situation</label><div class="value">'+(patient.situation||'<span class="empty-val">None</span>')+'</div></div>' +
      '<div class="field"><label>Plan</label><div class="value">'+(patient.plan||'<span class="empty-val">None</span>')+'</div></div>';
    card.appendChild(body);

    var actions = document.createElement("div");
    actions.className = "bed-actions";

    var editBtn = document.createElement("button");
    editBtn.className = "btn-outline";
    editBtn.textContent = "Edit Patient";
    editBtn.onclick = function(){ openPatientModal(room, bed, patient); };

    var dischargeBtn = document.createElement("button");
    dischargeBtn.className = "btn-danger-outline";
    dischargeBtn.textContent = "Discharge";
    dischargeBtn.onclick = function(){
      if(confirm("Discharge patient from "+room+bed+"?")){
        currentWard().rooms[bedKey(room,bed)] = null;
        saveState(); render();
      }
    };

    actions.appendChild(editBtn);
    actions.appendChild(dischargeBtn);
    card.appendChild(actions);

    return card;
  }

  /* Modal Logic with direct DOM attribute locking */
  var patientOverlay = document.getElementById("patientOverlay");
  var selectedType = "antenatal";
  var selectedAcuity = "stable";

  function setTypeUI(type){
    selectedType = type;
    document.querySelectorAll("#typeToggle .type-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.type === type); });
  }
  document.querySelectorAll("#typeToggle .type-btn").forEach(function(b){
    b.onclick = function(){ setTypeUI(b.dataset.type); };
  });

  function setAcuityUI(acuity){
    selectedAcuity = acuity;
    document.querySelectorAll("#acuityToggle .acuity-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.acuity === acuity); });
  }
  document.querySelectorAll("#acuityToggle .acuity-btn").forEach(function(b){
    b.onclick = function(){ setAcuityUI(b.dataset.acuity); };
  });

  function openPatientModal(room, bed, patient){
    var modalBox = document.getElementById("patientModalBox");
    modalBox.dataset.room = room;
    modalBox.dataset.bed = bed;

    document.getElementById("modalTitle").textContent = room + bed + (patient ? " — Edit" : " — New Patient");
    setTypeUI(patient ? patient.type : "antenatal");
    setAcuityUI(patient ? patient.acuity : "stable");

    document.getElementById("f_name").value = patient ? (patient.name||"") : "";
    document.getElementById("f_age").value = patient ? (patient.age||"") : "";
    document.getElementById("f_unit").value = patient ? (patient.unit||"") : "";
    document.getElementById("f_diagnosis").value = patient ? (patient.diagnosis||"") : "";
    document.getElementById("f_situation").value = patient ? (patient.situation||"") : "";
    document.getElementById("f_plan").value = patient ? (patient.plan||"") : "";

    patientOverlay.classList.add("show");
  }

  function closePatientModal(){ patientOverlay.classList.remove("show"); }

  document.getElementById("closePatientModal").onclick = closePatientModal;
  document.getElementById("cancelPatientModal").onclick = closePatientModal;

  document.getElementById("savePatientModal").onclick = function(){
    var modalBox = document.getElementById("patientModalBox");
    var room = modalBox.dataset.room;
    var bed = modalBox.dataset.bed;
    if(!room || !bed) return;

    var key = bedKey(room, bed);
    var existing = currentWard().rooms[key];

    currentWard().rooms[key] = {
      type: selectedType,
      acuity: selectedAcuity,
      name: document.getElementById("f_name").value.trim(),
      age: document.getElementById("f_age").value.trim(),
      unit: document.getElementById("f_unit").value,
      diagnosis: document.getElementById("f_diagnosis").value.trim(),
      situation: document.getElementById("f_situation").value.trim(),
      plan: document.getElementById("f_plan").value.trim(),
      admitted: existing ? existing.admitted : nowISO(),
      history: existing ? existing.history : []
    };

    saveState();
    closePatientModal();
    render();
  };

  searchBox.addEventListener("input", render);
  unitFilter.addEventListener("change", render);
  typeFilter.addEventListener("change", render);

  loadState();
  if(getStaffName()){ document.getElementById("staffNameBtn").textContent = "👤 " + getStaffName(); }
  render();

})();
</script>
</body>
</html>
