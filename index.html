<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ward Board</title>
<meta name="theme-color" content="#1a2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#1a2430; --ink-soft:#4a5a68; --line:#d7dee3; --line-soft:#e9edf0;
    --paper:#f6f8f9; --card:#ffffff; --accent:#0f6e5c; --accent-soft:#e3f2ee;
    --amber:#a8620a; --amber-soft:#fbf0dd; --red:#b3261e; --red-soft:#fbeae9;
    --blue:#1d5f9e; --blue-soft:#e5eff8; --empty-bar:#c7cfd4; font-size:16px;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--paper); color:var(--ink); margin:0; padding:0; padding-bottom:80px;}
  header{position:sticky; top:0; z-index:20; background:var(--ink); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between;}
  .brand h1{font-size:1.05rem; margin:0; color:#fff;}
  .ward-tabs{display:flex; gap:6px; padding:10px 20px; background:var(--card); border-bottom:1px solid var(--line-soft); overflow-x:auto;}
  .ward-tab{flex-shrink:0; padding:8px 16px; border-radius:20px; font-size:0.82rem; font-weight:600; background:var(--line-soft); color:var(--ink-soft); cursor:pointer;}
  .ward-tab.active{background:var(--accent); color:#fff;}
  .ward-tab.add-ward{background:#fff; border:1px dashed var(--line); color:var(--ink-soft);}
  .toolbar{display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line-soft); flex-wrap:wrap; gap:10px;}
  .pill{font-size:0.76rem; font-weight:600; padding:5px 11px; border-radius:20px; background:var(--line-soft); color:var(--ink-soft);}
  .pill.occ{background:var(--accent-soft); color:var(--accent);}
  #grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; padding:16px 20px; max-width:1700px; margin:0 auto;}
  .room-group{grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px;}
  .room-group-label{grid-column:1/-1; font-size:0.72rem; font-weight:700; text-transform:uppercase; color:var(--ink-soft); margin-top:6px;}
  .bed-card{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column;}
  .bed-card.empty{background:#fbfcfc;}
  .bed-top{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--paper); border-bottom:1px solid var(--line-soft);}
  .bed-num{font-size:1.1rem; font-weight:700; display:flex; align-items:center; gap:8px;}
  .bed-num .bar{width:6px; height:20px; border-radius:3px; background:var(--empty-bar);}
  .bed-card.occupied .bed-num .bar{background:var(--accent);}
  .bed-body{padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:9px;}
  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:20px; color:var(--ink-soft); text-align:center;}
  .bed-actions{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line-soft); background:#fcfdfd;}
  .bed-actions button{flex:1; padding:8px; background:var(--accent); color:#fff; border:none; border-radius:6px; font-weight:600; cursor:pointer;}
  #debugBanner{background:#b3261e; color:#fff; padding:12px; text-align:center; font-weight:bold; display:none; position:sticky; top:0; z-index:1000;}
</style>
</head>
<body>

<div id="debugBanner"></div>

<header>
  <div class="brand"><h1 id="appTitle">Ward Board</h1></div>
  <div><button id="staffNameBtn" style="background:rgba(255,255,255,0.1); color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">👤 Set name</button></div>
</header>

<div class="ward-tabs" id="wardTabs"></div>

<div class="toolbar">
  <div class="stat-pills" id="statPills"></div>
</div>

<div id="grid"></div>

<script>
try {
  (function(){
    "use strict";

    var STORAGE_KEY = "ward_board_v1";
    var ROOMS_PER_WARD = 20;
    var BEDS = ["A","B"];

    var state = { wardOrder: [], wards: {} };
    var activeWardId = null;

    function uid(){ return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

    function loadState(){
      try{
        var raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          var parsed = JSON.parse(raw);
          if(parsed && parsed.wards && parsed.wardOrder){ state = parsed; }
        }
      }catch(e){
        localStorage.removeItem(STORAGE_KEY);
      }

      if(!state.wardOrder || state.wardOrder.length === 0){
        state.wardOrder = [];
        state.wards = {};
        ["Ward A","Ward B","Ward C","Ward D","Ward E"].forEach(function(name){
          var id = uid();
          state.wardOrder.push(id);
          state.wards[id] = { name: name, rooms: {} };
        });
      }
      activeWardId = state.wardOrder[0];
    }

    function saveState(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    }

    function currentWard(){
      return state.wards[activeWardId] || state.wards[state.wardOrder[0]];
    }

    function renderWardTabs(){
      var wardTabsEl = document.getElementById("wardTabs");
      if(!wardTabsEl) return;
      wardTabsEl.innerHTML = "";
      state.wardOrder.forEach(function(id){
        var w = state.wards[id];
        var tab = document.createElement("div");
        tab.className = "ward-tab" + (id===activeWardId ? " active" : "");
        tab.textContent = w.name;
        tab.onclick = function(){ activeWardId = id; render(); };
        wardTabsEl.appendChild(tab);
      });
    }

    function render(){
      renderWardTabs();
      var grid = document.getElementById("grid");
      if(!grid) return;
      grid.innerHTML = "";

      var w = currentWard();
      var occCount = 0;

      for(var r=1; r<=ROOMS_PER_WARD; r++){
        BEDS.forEach(function(bed){
          if(w.rooms[r + bed]) occCount++;
        });
      }

      var statPills = document.getElementById("statPills");
      if(statPills){
        statPills.innerHTML = '<span class="pill occ">' + occCount + ' occupied beds</span>';
      }

      for(var room=1; room<=ROOMS_PER_WARD; room++){
        var groupWrap = document.createElement("div");
        groupWrap.className = "room-group";
        
        var label = document.createElement("div");
        label.className = "room-group-label";
        label.textContent = "Room " + room;
        grid.appendChild(label);

        BEDS.forEach(function(bed){
          var key = room + bed;
          var patient = w.rooms[key] || null;
          groupWrap.appendChild(renderBedCard(room, bed, patient));
        });

        grid.appendChild(groupWrap);
      }
    }

    function renderBedCard(room, bed, patient){
      var card = document.createElement("div");
      card.className = "bed-card " + (patient ? "occupied" : "empty");

      var top = document.createElement("div");
      top.className = "bed-top";
      top.innerHTML = '<div class="bed-num"><span class="bar"></span>' + room + bed + '</div>';
      card.appendChild(top);

      var body = document.createElement("div");
      body.className = "bed-body";

      if(!patient){
        body.innerHTML = '<div class="empty-state"><div>Empty Bed</div></div>';
        card.appendChild(body);
        
        var actions = document.createElement("div");
        actions.className = "bed-actions";
        var addBtn = document.createElement("button");
        addBtn.textContent = "Add Patient";
        addBtn.onclick = function(){
          var name = prompt("Patient Name/Initials for " + room + bed + ":");
          if(name){
            var w = currentWard();
            w.rooms[room + bed] = { name: name, type: "antenatal", acuity: "stable", diagnosis: "Test admission", admitted: new Date().toISOString(), history: [] };
            saveState();
            render();
          }
        };
        actions.appendChild(addBtn);
        card.appendChild(actions);
      } else {
        body.innerHTML = '<div style="font-weight:700;">' + patient.name + '</div><div style="font-size:0.8rem; color:#555;">' + patient.diagnosis + '</div>';
        card.appendChild(body);
      }

      return card;
    }

    loadState();
    render();

  })();
} catch(err) {
  var b = document.getElementById("debugBanner");
  if(b) {
    b.style.display = "block";
    b.textContent = "Script Error: " + err.message;
  }
}
</script>
</body>
</html>
