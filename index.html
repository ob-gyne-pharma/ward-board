<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ward Board</title>
<meta name="theme-color" content="#1a2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ward Board">
<style>
  :root{
    --ink:#1a2430; --ink-soft:#4a5a68; --line:#d7dee3; --line-soft:#e9edf0;
    --paper:#f6f8f9; --card:#ffffff; --accent:#0f6e5c; --accent-soft:#e3f2ee;
    --amber:#a8620a; --amber-soft:#fbf0dd; --red:#b3261e; --red-soft:#fbeae9;
    --blue:#1d5f9e; --blue-soft:#e5eff8; --purple:#6b4c9e; --purple-soft:#efe8f8;
    --empty-bar:#c7cfd4; font-size:16px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--paper); color:var(--ink); padding-bottom:80px;
    -webkit-tap-highlight-color: transparent;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--ink); color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .brand{display:flex; align-items:baseline; gap:10px; min-width:0;}
  .brand .mark{width:10px; height:10px; border-radius:2px; background:var(--accent); display:inline-block; transform:rotate(45deg); flex-shrink:0;}
  .brand h1{font-size:1.05rem; font-weight:600; margin:0; color:#fff; background:none; border:none; padding:2px 4px; max-width:220px; cursor:text;}
  .header-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  #clock{font-variant-numeric:tabular-nums; font-size:0.82rem; color:#cdd6dc;}

  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:6px;
    font-size:0.82rem; padding:8px 14px; font-weight:600; touch-action:manipulation;
    transition:background .12s ease, transform .05s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:#0c5c4d;}
  .btn-ghost{background:rgba(255,255,255,0.1); color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,0.18);}
  .btn-outline{background:#fff; color:var(--ink); border:1px solid var(--line);}
  .btn-outline:hover{background:var(--line-soft);}
  .btn-danger-outline{background:#fff; color:var(--red); border:1px solid #e8b9b6;}
  .btn-danger-outline:hover{background:var(--red-soft);}
  .btn-small{padding:5px 10px; font-size:0.74rem;}

  .ward-tabs{
    display:flex; gap:6px; padding:10px 20px; background:var(--card);
    border-bottom:1px solid var(--line-soft); overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .ward-tab{
    flex-shrink:0; padding:8px 16px; border-radius:20px; font-size:0.82rem; font-weight:600;
    background:var(--line-soft); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .ward-tab.active{background:var(--accent); color:#fff;}
  .ward-tab.add-ward{background:#fff; border:1px dashed var(--line); color:var(--ink-soft);}

  .floor-map-bar{
    display:flex; gap:4px; padding:8px 20px; background:#eef2f5;
    border-bottom:1px solid var(--line-soft); overflow-x:auto; -webkit-overflow-scrolling:touch;
    align-items:center;
  }
  .floor-map-label{font-size:0.7rem; font-weight:700; text-transform:uppercase; color:var(--ink-soft); margin-right:6px; white-space:nowrap;}
  .room-pill{
    flex-shrink:0; width:28px; height:28px; border-radius:50%; font-size:0.7rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; background:#d7dee3; color:var(--ink-soft);
    cursor:pointer; text-decoration:none; border:1.5px solid transparent;
  }
  .room-pill.occ-stable{background:var(--blue-soft); color:var(--blue); border-color:var(--blue);}
  .room-pill.occ-review{background:var(--amber-soft); color:var(--amber); border-color:var(--amber);}
  .room-pill.occ-urgent{background:var(--red-soft); color:var(--red); border-color:var(--red);}

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; gap:12px; flex-wrap:wrap; background:var(--card); border-bottom:1px solid var(--line-soft);
  }
  .stat-pills{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    font-size:0.76rem; font-weight:600; padding:5px 11px; border-radius:20px;
    background:var(--line-soft); color:var(--ink-soft); display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  .pill.active{border:1.5px solid currentColor;}
  .pill.occ{background:var(--accent-soft); color:var(--accent);}
  .pill.urgent{background:var(--red-soft); color:var(--red);}
  .pill.review{background:var(--amber-soft); color:var(--amber);}
  .pill.stable{background:var(--blue-soft); color:var(--blue);}

  .filter-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  select, input, textarea{
    font-family:inherit; border:1px solid var(--line); border-radius:6px;
    padding:9px 10px; font-size:16px; background:#fff !important; color:var(--ink) !important;
    -webkit-text-fill-color:var(--ink); opacity:1; touch-action:manipulation;
  }
  select{-webkit-appearance:menulist; appearance:auto; min-height:42px;}

  #grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:14px; padding:16px 20px; max-width:1700px; margin:0 auto;
  }
  .room-group{
    grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px;
  }
  .room-header-row{
    grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
    margin-top:12px; border-bottom:1px solid var(--line-soft); padding-bottom:4px; scroll-margin-top:100px;
  }
  .room-group-label{
    font-size:0.78rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--ink);
  }
  .add-bedb-btn{
    font-size:0.7rem; padding:3px 8px; background:var(--line-soft); color:var(--ink-soft);
    border:1px dashed var(--line); border-radius:4px; cursor:pointer; font-weight:600;
  }
  .add-bedb-btn:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}

  .bed-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  .bed-card.empty{background:#fbfcfc;}
  .bed-card.acuity-urgent{box-shadow:0 0 0 2px var(--red);}
  .bed-card.acuity-review{box-shadow:0 0 0 2px var(--amber);}

  .bed-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line-soft); background:var(--paper);
  }
  .bed-num{font-size:1.1rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .bed-num .bar{width:6px; height:20px; border-radius:3px; background:var(--empty-bar);}
  .bed-card.occupied .bed-num .bar{background:var(--accent);}
  .bed-card.acuity-urgent .bed-num .bar{background:var(--red);}
  .bed-card.acuity-review .bed-num .bar{background:var(--amber);}

  .tag-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tag{
    font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:3px 8px; border-radius:20px; background:var(--line-soft); color:var(--ink-soft);
  }
  .tag.acuity-stable{background:var(--blue-soft); color:var(--blue);}
  .tag.acuity-review{background:var(--amber-soft); color:var(--amber);}
  .tag.acuity-urgent{background:var(--red-soft); color:var(--red);}
  .tag.type-antenatal{background:var(--accent-soft); color:var(--accent);}
  .tag.type-postnatal{background:var(--purple-soft); color:var(--purple);}
  .tag.type-gynae{background:#fdeee0; color:#b5580d;}
  .tag.unit-tag{background:var(--line-soft); color:var(--ink-soft);}

  .bed-body{padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:9px;}
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:24px 10px; color:var(--ink-soft); text-align:center; flex:1;
  }
  .empty-state .hint{font-size:0.78rem;}

  .field{display:flex; flex-direction:column; gap:3px;}
  .field label{font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);}
  .field .value{font-size:0.86rem; line-height:1.4; color:var(--ink); word-break:break-word; white-space:pre-wrap;}
  .field .value.empty-val{color:#aab4bb; font-style:italic;}

  .checklist-display{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; font-size:0.7rem; color:var(--ink-soft);}
  .chk-badge{background:var(--line-soft); padding:2px 6px; border-radius:4px; font-weight:600;}
  .chk-badge.checked{background:var(--accent-soft); color:var(--accent);}

  .patient-name-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .patient-name-row .pname{font-weight:700; font-size:1.0rem;}
  .patient-name-row .meta{font-size:0.76rem; color:var(--ink-soft);}

  .admit-row{
    display:flex; flex-direction:column; gap:2px;
    background:var(--paper); border:1px solid var(--line-soft); border-radius:7px; padding:7px 10px; font-size:0.73rem; color:var(--ink-soft);
  }

  .bed-actions{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line-soft); background:#fcfdfd; flex-wrap:wrap;}
  .bed-actions button{flex:1; min-width:44%;}

  .history-toggle{
    font-size:0.76rem; color:var(--accent); font-weight:600; cursor:pointer;
    background:none; padding:2px 0; text-align:left; border:none;
  }
  .history-list{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .history-entry{
    border-left:3px solid var(--line); padding:6px 10px; background:var(--paper); border-radius:0 6px 6px 0; font-size:0.8rem;
  }
  .history-entry .h-time{font-weight:700; color:var(--ink); font-size:0.75rem; display:flex; justify-content:space-between; gap:8px;}

  /* Modal Overlays */
  .overlay{
    position:fixed; inset:0; background:rgba(20,28,34,0.55);
    display:none; align-items:flex-start; justify-content:center; z-index:100; padding:24px 14px; overflow-y:auto;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:12px; width:100%; max-width:600px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); margin-top:20px;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line-soft);
  }
  .modal-head h2{font-size:1.05rem; margin:0;}
  .modal-close{background:none; color:var(--ink-soft); font-size:1.1rem; padding:4px 8px;}
  .modal-body{
    padding:18px 20px; display:flex; flex-direction:column; gap:14px;
    max-height:70vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .modal-foot{
    padding:14px 20px; border-top:1px solid var(--line-soft);
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; background:#fff; align-items:center;
  }

  .form-field{display:flex; flex-direction:column; gap:5px;}
  .form-field label{font-size:0.76rem; font-weight:700; color:var(--ink-soft);}
  .form-field textarea, .form-field input[type="text"], .form-field select{
    width:100%; padding:10px; border:1.5px solid var(--line); border-radius:7px;
    font-size:16px; font-family:inherit; resize:vertical; background:#fff !important; color:var(--ink) !important;
  }
  .form-field textarea{min-height:52px;}
  .form-row{display:flex; gap:10px; flex-wrap:wrap;}
  .form-row .form-field{flex:1; min-width:140px;}

  .checklist-grid{display:flex; gap:12px; flex-wrap:wrap; background:var(--paper); padding:12px; border-radius:8px; border:1px solid var(--line-soft);}
  .checklist-item{display:flex; align-items:center; gap:6px; font-size:0.8rem; font-weight:600; cursor:pointer;}
  .checklist-item input{width:18px; height:18px; accent-color:var(--accent); cursor:pointer;}

  .type-toggle{display:flex; gap:8px; flex-wrap:wrap;}
  .type-btn{
    flex:1; min-width:100px; padding:9px 8px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); font-weight:700; font-size:0.8rem; text-align:center;
  }
  .type-btn.active.antenatal{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .type-btn.active.postnatal{border-color:var(--purple); background:var(--purple-soft); color:var(--purple);}
  .type-btn.active.gynae{border-color:#b5580d; background:#fdeee0; color:#b5580d;}

  .acuity-toggle{display:flex; gap:8px;}
  .acuity-btn{
    flex:1; padding:9px 8px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); font-weight:700; font-size:0.8rem; text-align:center;
  }
  .acuity-btn.active.stable{border-color:var(--blue); background:var(--blue-soft); color:var(--blue);}
  .acuity-btn.active.review{border-color:var(--amber); background:var(--amber-soft); color:var(--amber);}
  .acuity-btn.active.urgent{border-color:var(--red); background:var(--red-soft); color:var(--red);}

  .section-divider{
    font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); border-top:1px solid var(--line-soft); padding-top:12px; margin-top:2px;
  }
  .quick-note-banner{background:var(--accent-soft); color:var(--accent); font-size:0.78rem; padding:8px 12px; border-radius:7px; font-weight:600;}

  footer{text-align:center; padding:18px; color:var(--ink-soft); font-size:0.74rem;}

  /* Print Views */
  #summaryPrintView, #fullPrintView{ display:none; }
  .summary-page{ font-family:'Segoe UI', Arial, sans-serif; color:#111; padding:14px 18px; }
  .summary-header{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #222; padding-bottom:6px; margin-bottom:8px; }
  .summary-header h1{font-size:15px; margin:0;}
  .summary-ward-block{margin-bottom:10px;}
  .summary-ward-title{font-size:12px; font-weight:700; text-transform:uppercase; margin:8px 0 4px; border-bottom:1px solid #ccc; padding-bottom:2px;}
  table.summary-table{width:100%; border-collapse:collapse; font-size:9.5px;}
  table.summary-table th{text-align:left; font-size:8px; text-transform:uppercase; color:#555; border-bottom:1px solid #999; padding:3px 4px;}
  table.summary-table td{border-bottom:1px solid #ddd; padding:3px 4px; vertical-align:top;}
  .acuity-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px;}
  .acuity-dot.urgent{background:#b3261e;} .acuity-dot.review{background:#a8620a;} .acuity-dot.stable{background:#1d5f9e;}

  @media print{
    body.printing-summary #grid, body.printing-summary header, body.printing-summary .ward-tabs, body.printing-summary .floor-map-bar, body.printing-summary .toolbar, body.printing-summary footer{display:none !important;}
    body.printing-summary #summaryPrintView{display:block !important;}
    body.printing-full header, body.printing-full .ward-tabs, body.printing-full .floor-map-bar, body.printing-full .toolbar, body.printing-full .bed-actions, body.printing-full footer, body.printing-full #grid{display:none !important;}
    body.printing-full #fullPrintView{display:block !important;}
    body.printing-full{background:#fff; padding:0;}
  }

  @media (max-width:640px){
    header{padding:10px 14px;}
    #clock{display:none;}
    .toolbar{padding:10px 14px; flex-direction:column; align-items:stretch;}
    .filter-row select, .filter-row input{flex:1;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"></span>
    <h1 id="appTitle" contenteditable="true" spellcheck="false" title="Tap to rename">Ward Board</h1>
  </div>
  <div class="header-actions">
    <span id="clock"></span>
    <span id="cloudStatus" style="font-size:0.72rem; background:#293846; padding:3px 8px; border-radius:4px; color:#a2f2c8;">☁️ Connecting...</span>
    <button class="btn-ghost btn-small" id="staffNameBtn">👤 Set name</button>
    <button class="btn-ghost" id="exportSummaryBtn">Handover Summary</button>
    <button class="btn-ghost" id="printBtn">Full Print</button>
  </div>
</header>

<div class="ward-tabs" id="wardTabs"></div>

<!-- Floor Map Quick-Jump Bar -->
<div class="floor-map-bar" id="floorMapBar">
  <span class="floor-map-label">Quick Jump:</span>
</div>

<div class="toolbar">
  <div class="stat-pills" id="statPills"></div>
  <div class="filter-row">
    <select id="unitFilter">
      <option value="">All units</option>
      <option value="A">Unit A</option>
      <option value="B">Unit B</option>
      <option value="C">Unit C</option>
      <option value="D">Unit D</option>
      <option value="E">Unit E</option>
    </select>
    <select id="typeFilter">
      <option value="">All types</option>
      <option value="antenatal">Antenatal</option>
      <option value="postnatal">Postnatal</option>
      <option value="gynae">Gynae</option>
    </select>
    <input type="search" id="searchBox" placeholder="Search name, diagnosis…" style="width:160px;">
  </div>
</div>

<div id="grid"></div>

<footer>For clinical use during duty</footer>

<!-- ===== Modal: Add/Edit Patient ===== -->
<div class="overlay" id="patientOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Bed — New Patient</h2>
      <button class="modal-close" id="closePatientModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label>Patient type</label>
        <div class="type-toggle" id="typeToggle">
          <button type="button" class="type-btn antenatal" data-type="antenatal">Antenatal</button>
          <button type="button" class="type-btn postnatal" data-type="postnatal">Postnatal</button>
          <button type="button" class="type-btn gynae" data-type="gynae">Gynae</button>
        </div>
      </div>

      <div class="form-field">
        <label>Acuity</label>
        <div class="acuity-toggle" id="acuityToggle">
          <button type="button" class="acuity-btn stable" data-acuity="stable">Stable</button>
          <button type="button" class="acuity-btn review" data-acuity="review">Needs Review</button>
          <button type="button" class="acuity-btn urgent" data-acuity="urgent">Urgent</button>
        </div>
      </div>

      <!-- Morning Round Safety Checklist -->
      <div class="form-field">
        <label>Morning Round Safety Checklist</label>
        <div class="checklist-grid">
          <label class="checklist-item"><input type="checkbox" id="chk_vte"> VTE Checked</label>
          <label class="checklist-item"><input type="checkbox" id="chk_edd"> EDD / Gestation</label>
          <label class="checklist-item"><input type="checkbox" id="chk_consult"> Consultant Updated</label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Name / Initials</label>
          <input type="text" id="f_name" placeholder="e.g. Mrs A.K.">
        </div>
        <div class="form-field">
          <label>Age</label>
          <input type="text" id="f_age" placeholder="e.g. 29y">
        </div>
        <div class="form-field">
          <label>Unit</label>
          <select id="f_unit">
            <option value="">—</option>
            <option value="A">Unit A</option>
            <option value="B">Unit B</option>
            <option value="C">Unit C</option>
            <option value="D">Unit D</option>
            <option value="E">Unit E</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label>Diagnosis / reason for admission</label>
        <textarea id="f_diagnosis"></textarea>
      </div>
      <div class="form-field">
        <label>Current situation</label>
        <textarea id="f_situation"></textarea>
      </div>

      <div id="fieldsAntenatal" style="display:none;">
        <div class="section-divider">Antenatal details</div>
        <div class="form-row" style="margin-top:10px;">
          <div class="form-field"><label>Gestation</label><input type="text" id="f_gestation" placeholder="e.g. 34+2 weeks"></div>
          <div class="form-field"><label>Indication</label><input type="text" id="f_indication" placeholder="e.g. reduced movements"></div>
        </div>
        <div class="form-field"><label>Fetal monitoring</label><textarea id="f_fetal" placeholder="e.g. CTG reactive"></textarea></div>
      </div>

      <div id="fieldsPostnatal" style="display:none;">
        <div class="section-divider">Postnatal details</div>
        <div class="form-row" style="margin-top:10px;">
          <div class="form-field"><label>Mode of delivery</label><input type="text" id="f_modeDelivery" placeholder="e.g. SVD, LSCS"></div>
          <div class="form-field"><label>Day post-delivery</label><input type="text" id="f_dayPostDelivery" placeholder="e.g. Day 1"></div>
        </div>
        <div class="form-field"><label>Baby / feeding</label><textarea id="f_baby" placeholder="e.g. Baby well"></textarea></div>
        <div class="form-field"><label>VTE prophylaxis</label><input type="text" id="f_vte" placeholder="e.g. LMWH given"></div>
      </div>

      <div id="fieldsGynae" style="display:none;">
        <div class="section-divider">Gynae details</div>
        <div class="form-row" style="margin-top:10px;">

<!-- Firebase Real-Time Sync Script with Empty-Database Handling -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, goOnline, goOffline } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7RoEpdCWOYfxnKyTykmhVV9xgnbeH3bE",
    authDomain: "wardboard-e7035.firebaseapp.com",
    databaseURL: "https://wardboard-e7035-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "wardboard-e7035",
    storageBucket: "wardboard-e7035.firebasestorage.app",
    messagingSenderId: "480376138159",
    appId: "1:480376138159:web:b0b6fe7c43168b49bee75a"
  };

  const statusEl = document.getElementById("cloudStatus");

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, firebaseConfig.databaseURL);
    const boardRef = ref(db, 'wardBoardState/v3');

    window.firebaseSync = {
      save: function(stateData) {
        if(statusEl) statusEl.textContent = "📤 Saving...";
        set(boardRef, stateData).then(function(){
          if(statusEl) statusEl.textContent = "⚡ Live Sync Active";
        }).catch(function(err){
          console.error("Firebase save error:", err);
          if(statusEl) statusEl.textContent = "❌ Save Error";
        });
      },
      listen: function(callback) {
        onValue(boardRef, function(snapshot){
          var val = snapshot.val();
          // As soon as Firebase responds, update status to active
          if(statusEl) statusEl.textContent = "⚡ Live Sync Active";
          callback(val);
        }, function(err){
          console.error("Firebase read error:", err);
          if(statusEl) statusEl.textContent = "❌ Read Error";
        });
      }
    };

    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "visible") {
        goOnline(db);
      } else {
        goOffline(db);
      }
    });

  } catch(e) {
    console.error("Firebase init error:", e);
    if(statusEl) statusEl.textContent = "❌ Init Error";
  }
</script>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "ward_board_v3";
  var ROOMS_PER_WARD = 24;

  var state = { wardOrder: [], wards: {} };
  var activeWardId = null;
  var activeAcuityFilter = "";
  var isRemoteUpdate = false;

  function uid(){ return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function initDefaultState(){
    if(!state.wardOrder || state.wardOrder.length === 0){
      state.wardOrder = [];
      state.wards = {};
      ["Ward A","Ward B","Ward C","Ward D","Ward E"].forEach(function(name){
        var id = uid();
        state.wardOrder.push(id);
        state.wards[id] = { name: name, rooms: {}, roomConfig: {} };
      });
    }
    if(!activeWardId || !state.wards[activeWardId]){
      activeWardId = state.wardOrder[0];
    }
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.wards && parsed.wardOrder){ state = parsed; }
      }
    }catch(e){ localStorage.removeItem(STORAGE_KEY); }

    initDefaultState();
    var titleEl = document.getElementById("appTitle");
    if(titleEl && state.appTitle) titleEl.textContent = state.appTitle;
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(!isRemoteUpdate && window.firebaseSync){
        window.firebaseSync.save(state);
      }
      return true;
    }catch(e){ return false; }
  }

  function currentWard(){
    var w = state.wards[activeWardId] || state.wards[state.wardOrder[0]];
    if(!w.roomConfig) w.roomConfig = {};
    return w;
  }

  function bedKey(room, bed){ return room + bed; }
  function nowISO(){ return new Date().toISOString(); }
  function fmtTime(iso){ return new Date(iso).toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short'}); }
  function fmtTimeShort(iso){ return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
  function fmtDateShort(iso){ return new Date(iso).toLocaleDateString([], {day:'2-digit', month:'short'}); }
  function daysSince(iso){ return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/(1000*60*60*24))); }
  function escapeHtml(str){
    if(!str) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function getStaffName(){ return (state.staffName || "").trim(); }
  
  function ensureStaffName(){
    var current = getStaffName();
    if(!current){
      var name = prompt("Please enter your staff name/initials (required for tracking updates):", "");
      if(name && name.trim()){
        state.staffName = name.trim();
        saveState();
      } else {
        state.staffName = "Unknown Staff";
      }
    }
    return getStaffName();
  }

  var staffBtn = document.getElementById("staffNameBtn");
  if(staffBtn){
    staffBtn.onclick = function(){
      var name = prompt("Your name (shown on updates):", getStaffName());
      if(name !== null){ state.staffName = name.trim(); saveState(); staffBtn.textContent = "👤 " + state.staffName; }
    };
  }

  /* Ward Tabs */
  function renderWardTabs(){
    var wardTabsEl = document.getElementById("wardTabs");
    if(!wardTabsEl) return;
    wardTabsEl.innerHTML = "";
    state.wardOrder.forEach(function(id){
      var w = state.wards[id];
      var tab = document.createElement("div");
      tab.className = "ward-tab" + (id===activeWardId ? " active" : "");
      tab.textContent = w.name;
      tab.onclick = function(){ activeWardId = id; render(); };
      wardTabsEl.appendChild(tab);
    });
    var addTab = document.createElement("div");
    addTab.className = "ward-tab add-ward";
    addTab.textContent = "+ Add ward";
    addTab.onclick = function(){
      var name = prompt("Name for new ward:", "Ward " + String.fromCharCode(65 + state.wardOrder.length));
      if(!name) return;
      var id = uid();
      state.wards[id] = { name: name.trim(), rooms: {}, roomConfig: {} };
      state.wardOrder.push(id);
      activeWardId = id;
      saveState(); render();
    };
    wardTabsEl.appendChild(addTab);
  }

  /* Floor Map Bar */
  function renderFloorMapBar(){
    var bar = document.getElementById("floorMapBar");
    if(!bar) return;
    bar.innerHTML = '<span class="floor-map-label">Quick Jump:</span>';
    var w = currentWard();

    for(var r=1; r<=ROOMS_PER_WARD; r++){
      var pill = document.createElement("a");
      pill.className = "room-pill";
      pill.textContent = r;
      pill.href = "#room_" + r;

      var pA = w.rooms[r+"A"];
      var pB = w.rooms[r+"B"];
      var targetP = pA || pB;
      if(targetP){
        pill.classList.add("occ-" + targetP.acuity);
      }
      bar.appendChild(pill);
    }
  }

  var TYPE_LABEL = { antenatal:"Antenatal", postnatal:"Postnatal", gynae:"Gynae" };
  var ACUITY_LABEL = { stable:"Stable", review:"Needs Review", urgent:"Urgent" };

  function render(){
    renderWardTabs();
    renderFloorMapBar();
    var grid = document.getElementById("grid");
    if(!grid) return;
    grid.innerHTML = "";

    var searchBox = document.getElementById("searchBox");
    var unitFilter = document.getElementById("unitFilter");
    var typeFilter = document.getElementById("typeFilter");

    var query = searchBox ? searchBox.value.trim().toLowerCase() : "";
    var unitQ = unitFilter ? unitFilter.value : "";
    var typeQ = typeFilter ? typeFilter.value : "";

    var occCount=0, urgentCount=0, reviewCount=0, stableCount=0;
    var w = currentWard();

    for(var r=1; r<=ROOMS_PER_WARD; r++){
      var beds = ["A"];
      if(w.roomConfig && w.roomConfig[r] && w.roomConfig[r].hasB) beds.push("B");
      beds.forEach(function(bed){
        var p = w.rooms[bedKey(r, bed)] || null;
        if(p){
          occCount++;
          if(p.acuity==="urgent") urgentCount++;
          else if(p.acuity==="review") reviewCount++;
          else stableCount++;
        }
      });
    }

    var statPills = document.getElementById("statPills");
    if(statPills){
      statPills.innerHTML =
        '<span class="pill occ"><span class="n">'+occCount+'</span> occupied</span>' +
        '<span class="pill urgent'+(activeAcuityFilter==="urgent"?" active":"")+'" id="pillUrgent"><span class="n">'+urgentCount+'</span> urgent</span>' +
        '<span class="pill review'+(activeAcuityFilter==="review"?" active":"")+'" id="pillReview"><span class="n">'+reviewCount+'</span> review</span>' +
        '<span class="pill stable'+(activeAcuityFilter==="stable"?" active":"")+'" id="pillStable"><span class="n">'+stableCount+'</span> stable</span>';

      document.getElementById("pillUrgent").onclick = function(){ activeAcuityFilter = activeAcuityFilter==="urgent"?"":"urgent"; render(); };
      document.getElementById("pillReview").onclick = function(){ activeAcuityFilter = activeAcuityFilter==="review"?"":"review"; render(); };
      document.getElementById("pillStable").onclick = function(){ activeAcuityFilter = activeAcuityFilter==="stable"?"":"stable"; render(); };
    }

    for(var room=1; room<=ROOMS_PER_WARD; room++){
      if(!w.roomConfig[room]) w.roomConfig[room] = { hasB: !!w.rooms[room+"B"] };
      var activeBeds = ["A"];
      if(w.roomConfig[room].hasB) activeBeds.push("B");

      var anyVisible = false;
      var groupWrap = document.createElement("div");
      groupWrap.className = "room-group";

      activeBeds.forEach(function(bed){
        var key = bedKey(room, bed);
        var patient = w.rooms[key] || null;

        if(patient){
          if(unitQ && patient.unit !== unitQ) return;
          if(typeQ && patient.type !== typeQ) return;
          if(activeAcuityFilter && patient.acuity !== activeAcuityFilter) return;
          if(query){
            var hay = [patient.name, patient.diagnosis, patient.situation, patient.plan, room+bed].join(" ").toLowerCase();
            if(hay.indexOf(query) === -1) return;
          }
        } else {
          if(unitQ || typeQ || activeAcuityFilter) return;
          if(query && (room+bed).toLowerCase().indexOf(query)===-1) return;
        }
        anyVisible = true;
        groupWrap.appendChild(renderBedCard(room, bed, patient));
      });

      if(anyVisible){
        var headerRow = document.createElement("div");
        headerRow.className = "room-header-row";
        headerRow.id = "room_" + room;
        
        var label = document.createElement("div");
        label.className = "room-group-label";
        label.textContent = "Room " + room;
        headerRow.appendChild(label);

        if(!w.roomConfig[room].hasB){
          var addBBtn = document.createElement("button");
          addBBtn.className = "add-bedb-btn";
          addBBtn.textContent = "+ Add Bed B";
          addBBtn.onclick = (function(rNum){
            return function(){
              w.roomConfig[rNum].hasB = true;
              saveState(); render();
            };
          })(room);
          headerRow.appendChild(addBBtn);
        } else {
          var removeBBtn = document.createElement("button");
          removeBBtn.className = "add-bedb-btn";
          removeBBtn.style.color = "var(--red)";
          removeBBtn.textContent = "Remove Bed B";
          removeBBtn.onclick = (function(rNum){
            return function(){
              if(w.rooms[rNum+"B"] && !confirm("Bed B is occupied. Remove it anyway?")) return;
              w.rooms[rNum+"B"] = null;
              w.roomConfig[rNum].hasB = false;
              saveState(); render();
            };
          })(room);
          headerRow.appendChild(removeBBtn);
        }

        grid.appendChild(headerRow);
        grid.appendChild(groupWrap);
      }
    }
  }

  function renderBedCard(room, bed, patient){
    var card = document.createElement("div");
    card.className = "bed-card " + (patient ? "occupied acuity-" + patient.acuity : "empty");

    var top = document.createElement("div");
    top.className = "bed-top";
    top.innerHTML = '<div class="bed-num"><span class="bar"></span>'+room+bed+'</div>';
    if(patient){
      top.innerHTML += '<div class="tag-row"><span class="tag acuity-'+patient.acuity+'">'+ACUITY_LABEL[patient.acuity]+'</span><span class="tag type-'+patient.type+'">'+TYPE_LABEL[patient.type]+'</span>'+(patient.unit?'<span class="tag unit-tag">Unit '+escapeHtml(patient.unit)+'</span>':'')+'</div>';
    }
    card.appendChild(top);

    var body = document.createElement("div");
    body.className = "bed-body";

    if(!patient){
      body.innerHTML = '<div class="empty-state"><div>No patient assigned</div><div class="hint">Tap Add Patient below.</div></div>';
      card.appendChild(body);
      var actionsEmpty = document.createElement("div");
      actionsEmpty.className = "bed-actions";
      var addBtn = document.createElement("button");
      addBtn.className = "btn-primary";
      addBtn.textContent = "Add Patient";
      addBtn.onclick = function(){ openPatientModal(room, bed, null); };
      actionsEmpty.appendChild(addBtn);
      card.appendChild(actionsEmpty);
      return card;
    }

    var lastEntry = patient.history && patient.history.length ? patient.history[patient.history.length-1] : null;
    var displaySituation = lastEntry ? lastEntry.situation : patient.situation;
    var displayPlan = lastEntry ? lastEntry.plan : patient.plan;

    var html = '<div class="patient-name-row"><span class="pname">'+escapeHtml(patient.name || "Unnamed")+'</span>'+(patient.age?'<span class="meta">'+escapeHtml(patient.age)+'</span>':'')+'</div>';
    html += '<div class="field"><label>Diagnosis</label><div class="value">'+(patient.diagnosis?escapeHtml(patient.diagnosis):'<span class="empty-val">Not recorded</span>')+'</div></div>';
    html += '<div class="field"><label>Current situation</label><div class="value">'+(displaySituation?escapeHtml(displaySituation):'<span class="empty-val">Not recorded</span>')+'</div></div>';
    html += '<div class="field"><label>Plan</label><div class="value">'+(displayPlan?escapeHtml(displayPlan):'<span class="empty-val">Not recorded</span>')+'</div></div>';
    
    var chk = patient.checklist || {};
    html += '<div class="checklist-display">' +
      '<span class="chk-badge '+(chk.vte?'checked':'')+'">✓ VTE</span>' +
      '<span class="chk-badge '+(chk.edd?'checked':'')+'">✓ EDD</span>' +
      '<span class="chk-badge '+(chk.consult?'checked':'')+'">✓ Consultant</span>' +
      '</div>';

    var admittedByStr = patient.addedBy ? escapeHtml(patient.addedBy) : "Unknown";
    var updatedByStr = lastEntry && lastEntry.updatedBy ? escapeHtml(lastEntry.updatedBy) : admittedByStr;
    var updateTimeStr = fmtTimeShort(lastEntry ? lastEntry.time : patient.admitted);

    html += '<div class="admit-row">' +
      '<span>Admitted: '+fmtDateShort(patient.admitted)+' by <strong>'+admittedByStr+'</strong></span>' +
      '<span>Last updated: <strong>'+updatedByStr+'</strong> at '+updateTimeStr+'</span>' +
      '</div>';

    body.innerHTML = html;

    if(patient.history && patient.history.length > 0){
      var toggle = document.createElement("button");
      toggle.className = "history-toggle";
      toggle.textContent = "▸ Show history ("+patient.history.length+")";
      var histList = document.createElement("div");
      histList.className = "history-list";
      histList.style.display = "none";
      toggle.onclick = function(){
        var open = histList.style.display !== "none";
        histList.style.display = open ? "none" : "flex";
        toggle.textContent = (open ? "▸ Show history (" : "▾ Hide history (") + patient.history.length + ")";
      };
      patient.history.slice().reverse().forEach(function(entry, idxRev){
        var realIdx = patient.history.length - 1 - idxRev;
        var he = document.createElement("div");
        he.className = "history-entry";
        he.innerHTML = '<div class="h-time"><span>'+fmtTime(entry.time)+' · '+ACUITY_LABEL[entry.acuity]+' · <strong>'+escapeHtml(entry.updatedBy||"Unknown")+'</strong></span><span class="del" data-idx="'+realIdx+'">Delete</span></div>'+
          (entry.situation?'<div class="h-row"><span class="h-label">Situation:</span> '+escapeHtml(entry.situation)+'</div>':'')+
          (entry.plan?'<div class="h-row"><span class="h-label">Plan:</span> '+escapeHtml(entry.plan)+'</div>':'');
        he.querySelector(".del").onclick = function(){
          if(confirm("Delete history entry?")){ patient.history.splice(realIdx,1); saveState(); render(); }
        };
        histList.appendChild(he);
      });
      body.appendChild(toggle);
      body.appendChild(histList);
    }

    card.appendChild(body);

    var actions = document.createElement("div");
    actions.className = "bed-actions";

    var updateBtn = document.createElement("button");
    updateBtn.className = "btn-primary";
    updateBtn.textContent = "Progress";
    updateBtn.onclick = function(){ openProgressModal(room, bed); };

    var editBtn = document.createElement("button");
    editBtn.className = "btn-outline";
    editBtn.textContent = "Edit";
    editBtn.onclick = function(){ openPatientModal(room, bed, patient); };

    var dischargeBtn = document.createElement("button");
    dischargeBtn.className = "btn-danger-outline";
    dischargeBtn.textContent = "Discharge";
    dischargeBtn.onclick = function(){
      if(confirm("Discharge patient from "+room+bed+"?")){
        currentWard().rooms[bedKey(room,bed)] = null;
        saveState(); render();
      }
    };

    actions.appendChild(updateBtn);
    actions.appendChild(editBtn);
    actions.appendChild(dischargeBtn);
    card.appendChild(actions);

    return card;
  }

  /* Modals */
  var patientOverlay = document.getElementById("patientOverlay");
  var currentBedForModal = null;
  var selectedType = "antenatal";
  var selectedAcuity = "stable";

  function setTypeUI(type){
    selectedType = type;
    document.querySelectorAll("#typeToggle .type-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.type === type); });
    var fa = document.getElementById("fieldsAntenatal");
    var fp = document.getElementById("fieldsPostnatal");
    var fg = document.getElementById("fieldsGynae");
    if(fa) fa.style.display = type==="antenatal" ? "block" : "none";
    if(fp) fp.style.display = type==="postnatal" ? "block" : "none";
    if(fg) fg.style.display = type==="gynae" ? "block" : "none";
  }
  document.querySelectorAll("#typeToggle .type-btn").forEach(function(b){
    b.onclick = function(){ setTypeUI(b.dataset.type); };
  });

  function setAcuityUI(acuity){
    selectedAcuity = acuity;
    document.querySelectorAll("#acuityToggle .acuity-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.acuity === acuity); });
  }
  document.querySelectorAll("#acuityToggle .acuity-btn").forEach(function(b){
    b.onclick = function(){ setAcuityUI(b.dataset.acuity); };
  });

  function openPatientModal(room, bed, patient){
    ensureStaffName();
    currentBedForModal = {room:room, bed:bed};
    document.getElementById("modalTitle").textContent = room + bed + (patient ? " — Edit" : " — New Patient");
    setTypeUI(patient ? patient.type : "antenatal");
    setAcuityUI(patient ? patient.acuity : "stable");

    var chk = patient && patient.checklist ? patient.checklist : {};
    document.getElementById("chk_vte").checked = !!chk.vte;
    document.getElementById("chk_edd").checked = !!chk.edd;
    document.getElementById("chk_consult").checked = !!chk.consult;

    function setVal(id, v){ var el = document.getElementById(id); if(el) el.value = v || ""; }
    setVal("f_name", patient ? patient.name : "");
    setVal("f_age", patient ? patient.age : "");
    setVal("f_unit", patient ? patient.unit : "");
    setVal("f_diagnosis", patient ? patient.diagnosis : "");
    setVal("f_situation", patient ? patient.situation : "");
    setVal("f_plan", patient ? patient.plan : "");
    setVal("f_nextReview", patient ? patient.nextReview : "");
    setVal("f_gestation", patient ? patient.gestation : "");
    setVal("f_indication", patient ? patient.indication : "");
    setVal("f_fetal", patient ? patient.fetal : "");
    setVal("f_modeDelivery", patient ? patient.modeDelivery : "");
    setVal("f_dayPostDelivery", patient ? patient.dayPostDelivery : "");
    setVal("f_baby", patient ? patient.baby : "");
    setVal("f_vte", patient ? patient.vte : "");
    setVal("f_procedure", patient ? patient.procedure : "");
    setVal("f_drains", patient ? patient.drains : "");
    setVal("f_mobilisation", patient ? patient.mobilisation : "");
    setVal("f_labs", patient ? patient.labs : "");

    if(patientOverlay) patientOverlay.classList.add("show");
  }

  function closePatientModal(){ if(patientOverlay) patientOverlay.classList.remove("show"); currentBedForModal = null; }

  var cPat = document.getElementById("closePatientModal");
  var canPat = document.getElementById("cancelPatientModal");
  if(cPat) cPat.onclick = closePatientModal;
  if(canPat) canPat.onclick = closePatientModal;

  var savePat = document.getElementById("savePatientModal");
  if(savePat){
    savePat.onclick = function(){
      if(!currentBedForModal) return;
      var staffName = ensureStaffName();
      var key = bedKey(currentBedForModal.room, currentBedForModal.bed);
      var w = currentWard();
      var existing = w.rooms[key];

      function getVal(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }

      w.rooms[key] = {
        type: selectedType,
        acuity: selectedAcuity,
        checklist: {
          vte: document.getElementById("chk_vte").checked,
          edd: document.getElementById("chk_edd").checked,
          consult: document.getElementById("chk_consult").checked
        },
        name: getVal("f_name"),
        age: getVal("f_age"),
        unit: getVal("f_unit"),
        diagnosis: getVal("f_diagnosis"),
        situation: getVal("f_situation"),
        plan: getVal("f_plan"),
        nextReview: getVal("f_nextReview"),
        gestation: getVal("f_gestation"),
        indication: getVal("f_indication"),
        fetal: getVal("f_fetal"),
        modeDelivery: getVal("f_modeDelivery"),
        dayPostDelivery: getVal("f_dayPostDelivery"),
        baby: getVal("f_baby"),
        vte: getVal("f_vte"),
        procedure: getVal("f_procedure"),
        drains: getVal("f_drains"),
        mobilisation: getVal("f_mobilisation"),
        labs: getVal("f_labs"),
        admitted: existing ? existing.admitted : nowISO(),
        addedBy: existing ? existing.addedBy : staffName,
        history: existing && existing.history ? existing.history : []
      };

      saveState();
      closePatientModal();
      render();
    };
  }

  /* Progress Update Modal */
  var progressOverlay = document.getElementById("progressOverlay");
  var currentBedForProgress = null;
  var progressAcuity = "stable";

  function setProgressAcuityUI(acuity){
    progressAcuity = acuity;
    document.querySelectorAll("#acuityToggleProgress .acuity-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.acuity === acuity); });
  }
  document.querySelectorAll("#acuityToggleProgress .acuity-btn").forEach(function(b){
    b.onclick = function(){ setProgressAcuityUI(b.dataset.acuity); };
  });

  function openProgressModal(room, bed){
    ensureStaffName();
    currentBedForProgress = {room:room, bed:bed};
    var patient = currentWard().rooms[bedKey(room, bed)];
    document.getElementById("progressModalTitle").textContent = "Progress Update — " + room + bed;
    var lastEntry = patient.history && patient.history.length ? patient.history[patient.history.length-1] : null;

    setProgressAcuityUI(patient.acuity || "stable");
    var ps = document.getElementById("p_situation");
    var pp = document.getElementById("p_plan");
    var pn = document.getElementById("p_nextReview");
    if(ps) ps.value = lastEntry ? lastEntry.situation : patient.situation || "";
    if(pp) pp.value = lastEntry ? lastEntry.plan : patient.plan || "";
    if(pn) pn.value = (lastEntry && lastEntry.nextReview!==undefined) ? lastEntry.nextReview : patient.nextReview || "";

    if(progressOverlay) progressOverlay.classList.add("show");
  }

  function closeProgressModal(){ if(progressOverlay) progressOverlay.classList.remove("show"); currentBedForProgress = null; }

  var cProg = document.getElementById("closeProgressModal");
  var canProg = document.getElementById("cancelProgressModal");
  if(cProg) cProg.onclick = closeProgressModal;
  if(canProg) canProg.onclick = closeProgressModal;

  var saveProg = document.getElementById("saveProgressModal");
  if(saveProg){
    saveProg.onclick = function(){
      if(!currentBedForProgress) return;
      var staffName = ensureStaffName();
      var patient = currentWard().rooms[bedKey(currentBedForProgress.room, currentBedForProgress.bed)];
      var ps = document.getElementById("p_situation");
      var pp = document.getElementById("p_plan");
      var pn = document.getElementById("p_nextReview");

      var entry = {
        time: nowISO(),
        acuity: progressAcuity,
        situation: ps ? ps.value.trim() : "",
        plan: pp ? pp.value.trim() : "",
        nextReview: pn ? pn.value.trim() : "",
        updatedBy: staffName
      };
      patient.acuity = progressAcuity;
      if(!patient.history) patient.history = [];
      patient.history.push(entry);
      saveState();
      closeProgressModal();
      render();
    };
  }

  /* Handover Summary Export */
  function buildSummaryHtml(onlyWardId){
    var html = '<div class="summary-page">';
    var titleSuffix = onlyWardId ? (' — ' + escapeHtml(state.wards[onlyWardId].name)) : '';
    html += '<div class="summary-header"><h1>'+escapeHtml(state.appTitle||"Ward Board")+' — Handover Summary'+titleSuffix+'</h1>' +
      '<span class="meta">'+fmtTime(nowISO())+'</span></div>';

    var wardIds = onlyWardId ? [onlyWardId] : state.wardOrder;

    wardIds.forEach(function(wardId){
      var w = state.wards[wardId];
      if(!w || !w.rooms) return;
      var rows = [];
      for(var r=1; r<=ROOMS_PER_WARD; r++){
        var beds = ["A"];
        if(w.roomConfig && w.roomConfig[r] && w.roomConfig[r].hasB) beds.push("B");
        beds.forEach(function(bed){
          var p = w.rooms[bedKey(r,bed)];
          if(p) rows.push({room:r, bed:bed, patient:p});
        });
      }
      if(rows.length===0) return;

      html += '<div class="summary-ward-block"><div class="summary-ward-title">'+escapeHtml(w.name)+' ('+rows.length+' patients)</div>';
      html += '<table class="summary-table"><thead><tr>' +
        '<th>Bed</th><th>Name</th><th>Type</th><th>Unit</th><th>Diagnosis</th><th>Situation / Plan</th><th>Next review</th>' +
        '</tr></thead><tbody>';

      rows.forEach(function(row){
        var p = row.patient;
        var lastEntry = p.history && p.history.length ? p.history[p.history.length-1] : null;
        var situation = lastEntry ? lastEntry.situation : p.situation;
        var plan = lastEntry ? lastEntry.plan : p.plan;
        var nextReview = lastEntry && lastEntry.nextReview !== undefined ? lastEntry.nextReview : p.nextReview;
        var combined = [situation, plan].filter(Boolean).join(" — ");

        html += '<tr>' +
          '<td class="bed-col"><span class="acuity-dot '+p.acuity+'"></span>'+row.room+row.bed+'</td>' +
          '<td>'+escapeHtml(p.name||"—")+(p.age?(' <span style="color:#777;">'+escapeHtml(p.age)+'</span>'):'')+'</td>' +
          '<td>'+TYPE_LABEL[p.type]+'</td>' +
          '<td>'+escapeHtml(p.unit||"—")+'</td>' +
          '<td>'+escapeHtml(p.diagnosis||"—")+'</td>' +
          '<td>'+escapeHtml(combined||"—")+'</td>' +
          '<td>'+escapeHtml(nextReview||"—")+'</td>' +
          '</tr>';
      });
      html += '</tbody></table></div>';
    });

    html += '</div>';
    return html;
  }

  function runSummaryPrint(onlyWardId){
    var spv = document.getElementById("summaryPrintView");
    if(spv) spv.innerHTML = buildSummaryHtml(onlyWardId);
    document.body.classList.add("printing-summary");
    window.print();
    setTimeout(function(){ document.body.classList.remove("printing-summary"); }, 500);
  }

  var expSumBtn = document.getElementById("exportSummaryBtn");
  if(expSumBtn){
    expSumBtn.onclick = function(){
      var currentName = currentWard().name;
      var choice = confirm('Export Handover Summary:\n\nOK = Just "'+currentName+'" (current ward)\nCancel = All wards combined');
      if(choice){ runSummaryPrint(activeWardId); }
      else { runSummaryPrint(null); }
    };
  }

  /* Full Print Generator */
  function buildFullPrintHtml(){
    var w = currentWard();
    var html = '<div class="summary-page">';
    html += '<div class="summary-header"><h1>'+escapeHtml(state.appTitle||"Ward Board")+' — ' + escapeHtml(w.name) + ' (Full Ward Board)</h1>' +
      '<span class="meta">'+fmtTime(nowISO())+'</span></div>';

    html += '<table class="summary-table"><thead><tr>' +
      '<th>Room / Bed</th><th>Status / Patient</th><th>Type / Unit</th><th>Acuity</th><th>Diagnosis & Situation</th><th>Plan & Next Review</th>' +
      '</tr></thead><tbody>';

    for(var r=1; r<=ROOMS_PER_WARD; r++){
      var beds = ["A"];
      if(w.roomConfig && w.roomConfig[r] && w.roomConfig[r].hasB) beds.push("B");
      beds.forEach(function(bed){
        var key = bedKey(r, bed);
        var p = w.rooms[key];
        html += '<tr>';
        html += '<td class="bed-col" style="font-size:11px;">Room ' + r + bed + '</td>';
        if(p){
          var lastEntry = p.history && p.history.length ? p.history[p.history.length-1] : null;
          var situation = lastEntry ? lastEntry.situation : p.situation;
          var plan = lastEntry ? lastEntry.plan : p.plan;
          var nextReview = lastEntry && lastEntry.nextReview !== undefined ? lastEntry.nextReview : p.nextReview;
          
          html += '<td><strong>'+escapeHtml(p.name||"Unnamed")+'</strong>'+(p.age?' ('+escapeHtml(p.age)+')':'')+'</td>';
          html += '<td>'+TYPE_LABEL[p.type]+(p.unit?' / Unit '+escapeHtml(p.unit):'')+'</td>';
          html += '<td><span class="acuity-dot '+p.acuity+'"></span>'+ACUITY_LABEL[p.acuity]+'</td>';
          html += '<td><strong>Dx:</strong> '+escapeHtml(p.diagnosis||"—")+'<br><strong>Sit:</strong> '+escapeHtml(situation||"—")+'</td>';
          html += '<td><strong>Plan:</strong> '+escapeHtml(plan||"—")+(nextReview?'<br><strong>Review:</strong> '+escapeHtml(nextReview):'')+'</td>';
        } else {
          html += '<td colspan="5" style="color:#777; font-style:italic;">Empty Bed</td>';
        }
        html += '</tr>';
      });
    }
    html += '</tbody></table></div>';
    return html;
  }

  var printBtn = document.getElementById("printBtn");
  if(printBtn){
    printBtn.onclick = function(){
      var fpv = document.getElementById("fullPrintView");
      if(fpv) fpv.innerHTML = buildFullPrintHtml();
      document.body.classList.add("printing-full");
      window.print();
      setTimeout(function(){ document.body.classList.remove("printing-full"); }, 500);
    };
  }

  var searchBox = document.getElementById("searchBox");
  var unitFilter = document.getElementById("unitFilter");
  var typeFilter = document.getElementById("typeFilter");
  if(searchBox) searchBox.addEventListener("input", render);
  if(unitFilter) unitFilter.addEventListener("change", render);
  if(typeFilter) typeFilter.addEventListener("change", render);

  function tickClock(){
    var el = document.getElementById("clock");
    if(el){
      el.textContent = new Date().toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short'});
    }
  }
  tickClock();
  setInterval(tickClock, 1000*30);

  // Initialize and connect Firebase Real-Time Listener with empty database handling
  loadState();
  if(getStaffName() && staffBtn){ staffBtn.textContent = "👤 " + getStaffName(); }
  render();

  if(window.firebaseSync){
    window.firebaseSync.listen(function(remoteState){
      if(remoteState && remoteState.wards){
        isRemoteUpdate = true;
        state = remoteState;
        saveState(); 
        initDefaultState();
        render();
        isRemoteUpdate = false;
      } else {
        // If database is empty, push initial state to cloud
        saveState();
      }
    });
  }

})();
</script>
</body>
</html>
